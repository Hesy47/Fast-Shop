services:
  postgres:
    image: postgres:17
    container_name: fast_shop_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyPassword321
      POSTGRES_DB: fast_shop_db
    ports:
      # Maps container port 5432 to your localhost port 5432
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:8
  #   container_name: fast_shop_redis_dev
  #   command: ["redis-server", "--requirepass", "MyRedisPassword"]
  #   ports:
  #     # Maps container port 6379 to your localhost port 6379
  #     - "6379:6379"

  minio:
    image: minio/minio
    container_name: fast_shop_minio_dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # API Port
      - "9000:9000"
      # Web Console Port (http://localhost:9001)
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: